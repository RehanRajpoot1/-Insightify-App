services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roster
    ports:
      - '5433:5432'
    volumes:
      - roster_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/roster?schema=public
      JWT_SECRET: change-this-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      CORS_ORIGIN: http://192.168.2.60:3000
    ports:
      - '4001:4000'
      - '5555:5555'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE: http://192.168.2.60:4000
    ports:
      - '3001:3000'

volumes:
  roster_pgdata:
